services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://alumni:alumni@db:5432/alumni

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=alumni
      - POSTGRES_PASSWORD=alumni
      - POSTGRES_DB=alumni
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
