{% extends "base.html" %}

{% block title %}Alumni - Edit Job Posting{% endblock %}

{% block content %}
<h1>Edit Job Posting #{{ job_posting.id }}</h1>

<form method="POST" action="/job-postings/{{ job_posting.id }}/edit">
    <label>Title: <input type="text" name="title" value="{{ job_posting.title }}"></label>
    <label>Company: <input type="text" name="company" value="{{ job_posting.company }}"></label>
    <label>Description: <input type="text" name="description" value="{{ job_posting.description }}"></label>
    <label>Location: <input type="text" name="location" value="{{ job_posting.location }}"></label>
    <label>Posted date: <input type="text" name="posted_date" value="{{ job_posting.posted_date }}"></label>
    <button type="submit" class="btn">Save</button>
</form>

<p><em>Note: "Posted by" cannot be changed once a job posting is created.</em></p>
<p><a href="/job-postings">Back to list</a></p>
{% endblock %}
