<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alumni API - Docs</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 32px;
        }
        h1 {
            color: #3b4151;
        }
        .route {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .method {
            color: #fff;
            font-weight: bold;
            padding: 12px 20px;
            min-width: 90px;
            text-align: center;
        }
        .path {
            padding: 12px 20px;
            font-family: monospace;
            font-size: 16px;
            color: #3b4151;
        }
        .GET { background: #61affe; }
        .POST { background: #49cc90; }
        .PUT { background: #fca130; }
        .PATCH { background: #50e3c2; }
        .DELETE { background: #f93e3e; }
    </style>
</head>
<body>
    <h1>Alumni API Documentation</h1>
    {% for endpoint in endpoints %}
    <div class="route">
        {% for method in endpoint.methods %}
        <div class="method {{ method }}">{{ method }}</div>
        {% endfor %}
        <div class="path">{{ endpoint.path }}</div>
    </div>
    {% endfor %}
</body>
</html>
