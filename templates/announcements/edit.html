{% extends "base.html" %}

{% block title %}Alumni - Edit Announcement{% endblock %}

{% block content %}
<h1>Edit Announcement #{{ announcement.id }}</h1>

<form method="POST" action="/announcements/{{ announcement.id }}/edit">
    <label>Title: <input type="text" name="title" value="{{ announcement.title }}"></label>
    <label>Content: <input type="text" name="content" value="{{ announcement.content }}"></label>
    <label>Date: <input type="text" name="date" value="{{ announcement.date }}"></label>
    <button type="submit" class="btn">Save</button>
</form>

<p><a href="/announcements">Back to list</a></p>
{% endblock %}
