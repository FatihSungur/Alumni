<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alumni - Edit Announcement</title>
</head>
<body>
    <h1>Edit Announcement #{{ announcement.id }}</h1>

    <form method="POST" action="/announcements/{{ announcement.id }}/edit">
        <label>Title: <input type="text" name="title" value="{{ announcement.title }}"></label><br>
        <label>Content: <input type="text" name="content" value="{{ announcement.content }}"></label><br>
        <label>Date: <input type="text" name="date" value="{{ announcement.date }}"></label><br>
        <button type="submit">Save</button>
    </form>

    <p><a href="/announcements">Back to list</a></p>
</body>
</html>
